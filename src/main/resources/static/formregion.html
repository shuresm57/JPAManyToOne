<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <title>Region</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">

<div class="container">
    <nav class="navbar mb-4">
        <span class="navbar-brand mb-0 h1">Region</span>
        <button id="themeToggle" class="btn btn-outline-secondary btn-sm">🌙 Toggle theme</button>
    </nav>

    <h1 class="mb-4">Insert region</h1>

    <form action="http://localhost:8080/region" method="post" id="formRegion">

        <div class="mb-3">
            <label for="inpCode" class="form-label">Kode</label>
            <input
                    type="text"
                    name="kode"
                    class="form-control"
                    placeholder="eks. 7358"
                    id="inpCode"
                    required>
        </div>

        <div class="mb-3">
            <label for="inpName" class="form-label">Navn</label>
            <input
                    type="text"
                    name="navn"
                    class="form-control"
                    placeholder="eks. Gerlev"
                    id="inpName"
                    required>
        </div>

        <div class="mb-3">
            <label for="inpHref" class="form-label">Href</label>
            <input
                    type="text"
                    name="href"
                    class="form-control"
                    placeholder="https://www.roskilde.dk/da-dk/forside/"
                    id="inpHref"
                    required>
        </div>

        <button type="submit" class="btn btn-primary">Opret</button>
    </form>
</div>

<script>
    const saved = localStorage.getItem('theme');
    if (saved) {
        document.documentElement.setAttribute('data-bs-theme', saved);
    }

    // Toggle and save preference
    document.getElementById('themeToggle').addEventListener('click', () => {
        const current = document.documentElement.getAttribute('data-bs-theme') || 'light';
        const next = current === 'light' ? 'dark' : 'light';
        document.documentElement.setAttribute('data-bs-theme', next);
        localStorage.setItem('theme', next);
    });
</script>

<script src="/js/formregion.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
